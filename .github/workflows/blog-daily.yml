name: Daily SEO Blog Article

# Автоматический ежедневный запуск перенесён на cron на VPS (см. blog-cron.sh,
# устанавливается шагом deploy.yml) — ключи там читаются локально из blog.env,
# не хранятся в GitHub Secrets. Этот workflow оставлен только для ручного
# запуска/бэкофилла из GitHub UI.
on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Индекс темы для backfill (0-149), пусто = тема по дате'
        required: false
        type: string

jobs:
  publish-article:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and publish article
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AI_TUNNEL_API_KEY: ${{ secrets.AI_TUNNEL_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TOPIC_INDEX: ${{ github.event.inputs.topic_index }}
        run: node blog-auto-generate.js
