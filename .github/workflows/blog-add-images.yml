name: Add Images to Posts

on:
  workflow_dispatch:

jobs:
  add-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add cover images to posts without them
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: node blog-add-images.js
